name: NYX live world design

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate a bounded world from live NYX cognition
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo 'NVIDIA_API_KEY is unavailable in this repository' >&2
            exit 1
          fi
          npx --yes --package=tsx tsx src/cli/generateGame.ts \
            --out "$RUNNER_TEMP/nyx-world" \
            --prompt 'Design an original monumental citadel above a winding river in a dramatic mountain valley. Create a distinct original sculpted 3D landmark using the SDF geometry graph, place it visibly, and choose your own terrain, atmosphere, architecture, and camera parameters.' \
            --nyx-world
      - name: Verify the generated project is model-authored and contains real mesh data
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            const root = path.join(process.env.RUNNER_TEMP, "nyx-world");
            const world = JSON.parse(fs.readFileSync(path.join(root, "world.json"), "utf8"));
            const provenance = JSON.parse(fs.readFileSync(path.join(root, "design-provenance.json"), "utf8"));
            const manifest = JSON.parse(fs.readFileSync(path.join(root, "asset-manifest.json"), "utf8"));
            if (!world.worldArt || provenance.source !== "live-nemotron-response" ||
                !/^[0-9a-f]{64}$/.test(provenance.responseSha256) ||
                !manifest.assets.some(asset => asset.origin === "generated" && asset.triangles > 500)) {
              process.exit(1);
            }
            console.log("Verified live-model world specification and generated 3D mesh manifest");
          '
      - uses: actions/upload-artifact@v4
        with:
          name: nyx-live-world-candidate
          path: ${{ runner.temp }}/nyx-world
          if-no-files-found: error
          retention-days: 7
